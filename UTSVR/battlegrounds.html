<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebVR Training Battleground - Environment</title>
  <!-- A-Frame versi terbaru (1.6.0) -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; background-color: #0b0f19; }
  </style>
</head>
<body>
  <a-scene
    renderer="antialias: true; colorManagement: true; highRefreshRate: true;"
    fog="type: exponential; color: #0b1320; density: 0.018"
  >
    <!-- Aset & Tekstur Prosedural -->
    <a-assets>
      <!-- Tekstur Grid Lantai yang dibuat via script di bawah -->
      <canvas id="grid-texture" width="512" height="512"></canvas>
    </a-assets>

    <!-- ========================================== -->
    <!-- 1. SKY & PENCAHAYAAN                       -->
    <!-- ========================================== -->
    <a-sky color="#0b1320"></a-sky>

    <!-- Pencahayaan Ambient & Directional -->
    <a-entity light="type: ambient; color: #5c7699; intensity: 0.7"></a-entity>
    <a-entity
      light="type: directional; color: #ffffff; intensity: 0.9; castShadow: false"
      position="10 20 10"
    ></a-entity>
    <!-- Lampu aksen biru di tengah arena -->
    <a-entity
      light="type: point; color: #00d2ff; intensity: 1.5; distance: 25"
      position="0 5 -6"
    ></a-entity>

    <!-- ========================================== -->
    <!-- 2. LANTAI ARENA (40m x 40m)                -->
    <!-- ========================================== -->
    <a-plane
      id="arena-floor"
      rotation="-90 0 0"
      width="40"
      height="40"
      material="src: #grid-texture; repeat: 20 20; roughness: 0.8; metalness: 0.2"
    ></a-plane>

    <!-- ========================================== -->
    <!-- 3. DINDING PEMBATAS ARENA                  -->
    <!-- ========================================== -->
    <!-- Dinding Utara (Depan Player) -->
    <a-entity position="0 3 -20">
      <a-box width="40" height="6" depth="0.5" color="#162032" roughness="0.7"></a-box>
      <!-- Garis Neon Horizontal -->
      <a-box width="38" height="0.15" depth="0.55" position="0 1.5 0" material="color: #00d2ff; emissive: #00d2ff; emissiveIntensity: 1.5"></a-box>
      <a-box width="38" height="0.1" depth="0.55" position="0 -2.2 0" material="color: #ff6b00; emissive: #ff6b00; emissiveIntensity: 1.2"></a-box>
    </a-entity>

    <!-- Dinding Selatan (Belakang Player) -->
    <a-entity position="0 3 20">
      <a-box width="40" height="6" depth="0.5" color="#162032" roughness="0.7"></a-box>
      <a-box width="38" height="0.15" depth="0.55" position="0 1.5 0" material="color: #00d2ff; emissive: #00d2ff; emissiveIntensity: 1.5"></a-box>
    </a-entity>

    <!-- Dinding Barat (Kiri) -->
    <a-entity position="-20 3 0" rotation="0 90 0">
      <a-box width="40" height="6" depth="0.5" color="#162032" roughness="0.7"></a-box>
      <a-box width="38" height="0.15" depth="0.55" position="0 1.5 0" material="color: #00d2ff; emissive: #00d2ff; emissiveIntensity: 1.5"></a-box>
    </a-entity>

    <!-- Dinding Timur (Kanan) -->
    <a-entity position="20 3 0" rotation="0 -90 0">
      <a-box width="40" height="6" depth="0.5" color="#162032" roughness="0.7"></a-box>
      <a-box width="38" height="0.15" depth="0.55" position="0 1.5 0" material="color: #00d2ff; emissive: #00d2ff; emissiveIntensity: 1.5"></a-box>
    </a-entity>

    <!-- ========================================== -->
    <!-- 4. ZONA SPAWN & MEJA KONTROL (DEKAT PLAYER)-->
    <!-- ========================================== -->
    <!-- Platform Spawn Player -->
    <a-cylinder
      position="0 0.02 4"
      radius="2"
      height="0.04"
      color="#1e293b"
      material="metalness: 0.5; roughness: 0.4"
    ></a-cylinder>
    <a-ring
      position="0 0.05 4"
      rotation="-90 0 0"
      radius-inner="1.9"
      radius-outer="2.0"
      material="color: #00d2ff; emissive: #00d2ff; emissiveIntensity: 1.5"
    ></a-ring>

    <!-- Meja Control Terminal (Sebelah Kiri Zona Spawn) -->
    <a-entity id="control-desk" position="-2.8 0 2.5" rotation="0 35 0">
      <a-box position="0 0.5 0" width="1.8" height="1" depth="0.7" color="#1e293b"></a-box>
      <a-box position="0 1.02 0" width="1.9" height="0.06" depth="0.8" color="#334155"></a-box>
      <!-- Bingkai Layar Hologram Terminal -->
      <a-plane
        position="0 1.55 0"
        rotation="-15 0 0"
        width="1.6"
        height="0.8"
        material="color: #00d2ff; opacity: 0.18; transparent: true; side: double"
      ></a-plane>
    </a-entity>

    <!-- Rak Peralatan / Senjata (Sebelah Kanan Zona Spawn) -->
    <a-entity id="weapon-rack" position="2.8 0 2.5" rotation="0 -35 0">
      <a-box position="0 0.5 0" width="2.2" height="1" depth="0.7" color="#1e293b"></a-box>
      <a-box position="0 1.02 0" width="2.3" height="0.06" depth="0.8" color="#334155"></a-box>
      <a-box position="0 1.06 0" width="2.1" height="0.02" depth="0.6" material="color: #ff6b00; emissive: #ff6b00; emissiveIntensity: 0.8"></a-box>
    </a-entity>

    <!-- ========================================== -->
    <!-- 5. ZONA DUMMY & RINTANGAN TAKTIS (TENGAH)  -->
    <!-- ========================================== -->
    <!-- Platform Utama Tempat Dummy Berdiri -->
    <a-entity id="dummy-zone" position="0 0 -6">
      <!-- Lantai Zona Target -->
      <a-box position="0 0.02 0" width="12" height="0.04" depth="6" color="#182234"></a-box>
      <!-- Garis Batas Zona Target (Merah/Oranye) -->
      <a-box position="0 0.05 3" width="12" height="0.02" depth="0.1" material="color: #ff3b30; emissive: #ff3b30; emissiveIntensity: 1.5"></a-box>
      <a-box position="0 0.05 -3" width="12" height="0.02" depth="0.1" material="color: #ff3b30; emissive: #ff3b30; emissiveIntensity: 1.5"></a-box>
      <a-box position="-6 0.05 0" width="0.1" height="0.02" depth="6" material="color: #ff3b30; emissive: #ff3b30; emissiveIntensity: 1.5"></a-box>
      <a-box position="6 0.05 0" width="0.1" height="0.02" depth="6" material="color: #ff3b30; emissive: #ff3b30; emissiveIntensity: 1.5"></a-box>
    </a-entity>

    <!-- Penghalang Taktis (Tactical Barricades / Cover) -->
    <!-- Barricade Kiri Depan -->
    <a-entity position="-4.5 0 -1.5" rotation="0 15 0">
      <a-box position="0 0.6 0" width="2.4" height="1.2" depth="0.4" color="#273449"></a-box>
      <a-box position="0 1.22 0" width="2.45" height="0.08" depth="0.45" color="#475569"></a-box>
      <a-box position="0 0.9 0.21" width="2.0" height="0.08" depth="0.02" material="color: #ff6b00; emissive: #ff6b00; emissiveIntensity: 1"></a-box>
    </a-entity>

    <!-- Barricade Kanan Depan -->
    <a-entity position="4.5 0 -1.5" rotation="0 -15 0">
      <a-box position="0 0.6 0" width="2.4" height="1.2" depth="0.4" color="#273449"></a-box>
      <a-box position="0 1.22 0" width="2.45" height="0.08" depth="0.45" color="#475569"></a-box>
      <a-box position="0 0.9 0.21" width="2.0" height="0.08" depth="0.02" material="color: #ff6b00; emissive: #ff6b00; emissiveIntensity: 1"></a-box>
    </a-entity>

    <!-- Barricade Belakang Dummy (Untuk latihan menembak di balik cover) -->
    <a-entity position="-3.5 0 -11" rotation="0 -10 0">
      <a-box position="0 0.75 0" width="3" height="1.5" depth="0.5" color="#273449"></a-box>
      <a-box position="0 1.2 0.26" width="2.6" height="0.08" depth="0.02" material="color: #00d2ff; emissive: #00d2ff; emissiveIntensity: 1"></a-box>
    </a-entity>

    <a-entity position="3.5 0 -11" rotation="0 10 0">
      <a-box position="0 0.75 0" width="3" height="1.5" depth="0.5" color="#273449"></a-box>
      <a-box position="0 1.2 0.26" width="2.6" height="0.08" depth="0.02" material="color: #00d2ff; emissive: #00d2ff; emissiveIntensity: 1"></a-box>
    </a-entity>

    <!-- Pilar Struktural Arena (4 Sudut Dalam) -->
    <a-entity id="pillars">
      <a-entity position="-11 0 -11">
        <a-box position="0 3 0" width="1.2" height="6" depth="1.2" color="#1e293b"></a-box>
        <a-box position="0 3 0" width="1.26" height="0.2" depth="1.26" material="color: #00d2ff; emissive: #00d2ff; emissiveIntensity: 1.2"></a-box>
      </a-entity>
      <a-entity position="11 0 -11">
        <a-box position="0 3 0" width="1.2" height="6" depth="1.2" color="#1e293b"></a-box>
        <a-box position="0 3 0" width="1.26" height="0.2" depth="1.26" material="color: #00d2ff; emissive: #00d2ff; emissiveIntensity: 1.2"></a-box>
      </a-entity>
      <a-entity position="-11 0 11">
        <a-box position="0 3 0" width="1.2" height="6" depth="1.2" color="#1e293b"></a-box>
        <a-box position="0 3 0" width="1.26" height="0.2" depth="1.26" material="color: #00d2ff; emissive: #00d2ff; emissiveIntensity: 1.2"></a-box>
      </a-entity>
      <a-entity position="11 0 11">
        <a-box position="0 3 0" width="1.2" height="6" depth="1.2" color="#1e293b"></a-box>
        <a-box position="0 3 0" width="1.26" height="0.2" depth="1.26" material="color: #00d2ff; emissive: #00d2ff; emissiveIntensity: 1.2"></a-box>
      </a-entity>
    </a-entity>

    <!-- ========================================== -->
    <!-- 6. KAMERA PREVIEW (UNTUK MENJELAJAHI LATAR) -->
    <!-- ========================================== -->
    <a-entity id="rig" position="0 0 4">
      <a-camera position="0 1.6 0" look-controls wasd-controls="acceleration: 25"></a-camera>
    </a-entity>
  </a-scene>

  <!-- Script untuk menggambar tekstur grid pada lantai -->
  <script>
    const canvas = document.getElementById('grid-texture');
    const ctx = canvas.getContext('2d');

    // Warna dasar lantai
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(0, 0, 512, 512);

    // Garis grid halus (sub-grid)
    ctx.strokeStyle = '#1e293b';
    ctx.lineWidth = 2;
    const step = 64;
    for (let i = 0; i <= 512; i += step) {
      ctx.beginPath();
      ctx.moveTo(i, 0);
      ctx.lineTo(i, 512);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(0, i);
      ctx.lineTo(512, i);
      ctx.stroke();
    }

    // Garis grid utama (tepi tile)
    ctx.strokeStyle = '#0284c7';
    ctx.lineWidth = 4;
    ctx.strokeRect(0, 0, 512, 512);
  </script>
</body>
</html>

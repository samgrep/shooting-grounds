<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WebVR Shooting Grounds</title>
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; background-color: #0b0f19; font-family: sans-serif; }
  </style>
</head>
<body>
  <a-scene
    renderer="antialias: true; colorManagement: true; highRefreshRate: true;"
    fog="type: exponential; color: #0b1320; density: 0.018"
    shooting-manager
  >
    <!-- ========================================== -->
    <!-- ASET & TEKSTUR PROSEDURAL                  -->
    <!-- ========================================== -->
    <a-assets timeout="60000">
      <a-asset-item id="dummy-model" src="training_dummy.glb"></a-asset-item>
      <a-asset-item id="rodin-model" src="rodin_sci_fi_gun.glb"></a-asset-item>
      <a-asset-item id="rifle-model" src="rifle.glb"></a-asset-item>
      <a-asset-item id="assault-model" src="assault_rfile.glb"></a-asset-item>
      <canvas id="grid-texture" width="512" height="512"></canvas>
      <canvas id="pegboard-texture" width="512" height="512"></canvas>
      <canvas id="terminal-canvas" width="1024" height="512"></canvas>
    </a-assets>

    <!-- ========================================== -->
    <!-- 1. SKY & PENCAHAYAAN                       -->
    <!-- ========================================== -->
    <a-sky color="#0b1320"></a-sky>

    <a-entity light="type: ambient; color: #5c7699; intensity: 0.85"></a-entity>
    <a-entity
      light="type: directional; color: #ffffff; intensity: 1.0; castShadow: false"
      position="10 20 10"
    ></a-entity>
    <a-entity
      light="type: point; color: #00d2ff; intensity: 1.5; distance: 25"
      position="0 5 -6"
    ></a-entity>

    <!-- ========================================== -->
    <!-- 2. LANTAI ARENA (40m x 40m)                -->
    <!-- ========================================== -->
    <a-plane
      id="arena-floor"
      rotation="-90 0 0"
      width="40"
      height="40"
      material="src: #grid-texture; repeat: 20 20; roughness: 0.8; metalness: 0.2"
    ></a-plane>

    <!-- ========================================== -->
    <!-- 3. DINDING PEMBATAS ARENA                  -->
    <!-- ========================================== -->
    <a-entity position="0 3 -20">
      <a-box width="40" height="6" depth="0.5" color="#162032" roughness="0.7"></a-box>
      <a-box width="38" height="0.15" depth="0.55" position="0 1.5 0" material="color: #00d2ff; emissive: #00d2ff; emissiveIntensity: 1.5"></a-box>
      <a-box width="38" height="0.1" depth="0.55" position="0 -2.2 0" material="color: #ff6b00; emissive: #ff6b00; emissiveIntensity: 1.2"></a-box>
    </a-entity>

    <a-entity position="0 3 20">
      <a-box width="40" height="6" depth="0.5" color="#162032" roughness="0.7"></a-box>
      <a-box width="38" height="0.15" depth="0.55" position="0 1.5 0" material="color: #00d2ff; emissive: #00d2ff; emissiveIntensity: 1.5"></a-box>
    </a-entity>

    <a-entity position="-20 3 0" rotation="0 90 0">
      <a-box width="40" height="6" depth="0.5" color="#162032" roughness="0.7"></a-box>
      <a-box width="38" height="0.15" depth="0.55" position="0 1.5 0" material="color: #00d2ff; emissive: #00d2ff; emissiveIntensity: 1.5"></a-box>
    </a-entity>

    <a-entity position="20 3 0" rotation="0 -90 0">
      <a-box width="40" height="6" depth="0.5" color="#162032" roughness="0.7"></a-box>
      <a-box width="38" height="0.15" depth="0.55" position="0 1.5 0" material="color: #00d2ff; emissive: #00d2ff; emissiveIntensity: 1.5"></a-box>
    </a-entity>

    <!-- ========================================== -->
    <!-- 4. ZONA SPAWN, TERMINAL & PEGBOARD SENJATA -->
    <!-- ========================================== -->
    <a-cylinder
      position="0 0.02 4"
      radius="2"
      height="0.04"
      color="#1e293b"
      material="metalness: 0.5; roughness: 0.4"
    ></a-cylinder>
    <a-ring
      position="0 0.05 4"
      rotation="-90 0 0"
      radius-inner="1.9"
      radius-outer="2.0"
      material="color: #00d2ff; emissive: #00d2ff; emissiveIntensity: 1.5"
    ></a-ring>

    <!-- TERMINAL INFORMASI (Kiri Zona Spawn) -->
    <a-entity id="control-desk" position="-2.8 0 2.5" rotation="0 35 0">
      <a-box class="solid" position="0 0.48 0" width="2.0" height="0.96" depth="0.85" color="#1e293b"></a-box>
      <a-box position="0 0.98 0" width="2.06" height="0.06" depth="0.9" color="#334155"></a-box>
      <a-box position="0 0.98 0.45" width="1.9" height="0.03" depth="0.03" material="color: #00d2ff; emissive: #00d2ff; emissiveIntensity: 1.2"></a-box>

      <a-box position="0 1.18 -0.15" width="0.24" height="0.4" depth="0.12" color="#334155"></a-box>

      <a-entity position="0 1.52 -0.05" rotation="-14 0 0">
        <a-box position="0 0 -0.03" width="1.96" height="1.04" depth="0.06" color="#0f172a"></a-box>
        <a-box position="0 0 -0.02" width="2.0" height="1.08" depth="0.03" material="color: #00d2ff; emissive: #00d2ff; emissiveIntensity: 0.9"></a-box>
        <a-plane
          id="terminal-screen"
          position="0 0 0.005"
          width="1.88"
          height="0.96"
          material="src: #terminal-canvas; shader: flat"
        ></a-plane>
      </a-entity>

      <!-- Tombol Patroli Dummy (klik / tekan E / tombol T) -->
      <a-cylinder position="0.68 1.0 0.22" radius="0.12" height="0.02" color="#0f172a"></a-cylinder>
      <a-cylinder
        id="patrol-button"
        position="0.68 1.03 0.22"
        radius="0.085"
        height="0.045"
        material="color: #ff6b00; emissive: #ff6b00; emissiveIntensity: 1.1"
      ></a-cylinder>
      <a-box
        id="patrol-hitbox"
        class="interactable"
        data-action="toggle-patrol"
        position="0.68 1.08 0.22"
        width="0.34"
        height="0.2"
        depth="0.34"
        material="opacity: 0; transparent: true"
      ></a-box>
      <a-text
        value="PATROLI DUMMY [T]"
        position="0.68 1.012 0.38"
        rotation="-90 0 0"
        align="center"
        width="0.9"
        color="#94a3b8"
      ></a-text>
    </a-entity>

    <!-- PEGBOARD SENJATA (Kanan Zona Spawn)
         Senjata di pegboard dibuat otomatis dari konfigurasi WEAPONS di script. -->
    <a-entity id="weapon-rack" position="2.8 0 2.5" rotation="0 -35 0">
      <!-- Kaki & Dudukan Bawah Pegboard -->
      <a-box class="solid" position="0 0.06 0" width="2.3" height="0.12" depth="0.65" color="#1e293b"></a-box>
      <a-box position="0 0.13 0.31" width="2.2" height="0.03" depth="0.03" material="color: #00d2ff; emissive: #00d2ff; emissiveIntensity: 1.2"></a-box>

      <!-- Tiang Rangka Kiri & Kanan -->
      <a-box position="-1.08 1.12 0" width="0.08" height="2.05" depth="0.12" color="#334155"></a-box>
      <a-box position="1.08 1.12 0" width="0.08" height="2.05" depth="0.12" color="#334155"></a-box>
      <!-- Palang Atas -->
      <a-box position="0 2.12 0" width="2.24" height="0.08" depth="0.12" color="#334155"></a-box>
      <a-box position="0 2.12 0.065" width="2.08" height="0.025" depth="0.02" material="color: #00d2ff; emissive: #00d2ff; emissiveIntensity: 1.5"></a-box>

      <!-- Papan Pegboard Berlubang -->
      <a-box
        class="rack-surface"
        position="0 1.25 0"
        width="2.08"
        height="1.62"
        depth="0.06"
        material="src: #pegboard-texture; repeat: 4 3; roughness: 0.65; metalness: 0.35"
      ></a-box>

      <!-- Rak Kecil di Bagian Bawah Pegboard -->
      <a-box class="rack-surface" position="0 0.42 0.14" width="2.08" height="0.05" depth="0.26" color="#334155"></a-box>

      <!-- Label Header Pegboard -->
      <a-text
        id="rack-label"
        value=""
        position="0 2.42 0"
        align="center"
        width="3.2"
        color="#00d2ff"
      ></a-text>
    </a-entity>

    <!-- ========================================== -->
    <!-- 5. ZONA DUMMY & RINTANGAN TAKTIS (TENGAH)  -->
    <!-- ========================================== -->
    <a-entity id="dummy-zone" position="0 0 -6">
      <!-- Lantai zona (lebar & posisinya dipakai sebagai batas patroli dummy) -->
      <a-box class="zone-floor" position="0 0.02 0" width="12" height="0.04" depth="6" color="#182234"></a-box>
      <a-box position="0 0.05 3" width="12" height="0.02" depth="0.1" material="color: #ff3b30; emissive: #ff3b30; emissiveIntensity: 1.5"></a-box>
      <a-box position="0 0.05 -3" width="12" height="0.02" depth="0.1" material="color: #ff3b30; emissive: #ff3b30; emissiveIntensity: 1.5"></a-box>
      <a-box position="-6 0.05 0" width="0.1" height="0.02" depth="6" material="color: #ff3b30; emissive: #ff3b30; emissiveIntensity: 1.5"></a-box>
      <a-box position="6 0.05 0" width="0.1" height="0.02" depth="6" material="color: #ff3b30; emissive: #ff3b30; emissiveIntensity: 1.5"></a-box>
    </a-entity>

    <!-- Training Dummy Target
         dummy-patrol: bergerak kanan-kiri di dalam #dummy-zone (aktifkan dengan tombol T / tombol di terminal) -->
    <a-entity
      id="training-dummy"
      class="shootable solid"
      data-collider-size="0.8 0.8"
      target-dummy
      dummy-patrol="zone: #dummy-zone; speed: 1.8; margin: 0.15"
      gltf-model="#dummy-model"
      position="0 0 -6"
      rotation="0 0 0"
      scale="0.12 0.12 0.12"
    ></a-entity>

    <!-- Penghalang Taktis -->
    <a-entity position="-4.5 0 -1.5" rotation="0 15 0">
      <a-box class="solid" position="0 0.6 0" width="2.45" height="1.2" depth="0.45" color="#273449"></a-box>
      <a-box position="0 1.22 0" width="2.45" height="0.08" depth="0.45" color="#475569"></a-box>
      <a-box position="0 0.9 0.21" width="2.0" height="0.08" depth="0.02" material="color: #ff6b00; emissive: #ff6b00; emissiveIntensity: 1"></a-box>
    </a-entity>

    <a-entity position="4.5 0 -1.5" rotation="0 -15 0">
      <a-box class="solid" position="0 0.6 0" width="2.45" height="1.2" depth="0.45" color="#273449"></a-box>
      <a-box position="0 1.22 0" width="2.45" height="0.08" depth="0.45" color="#475569"></a-box>
      <a-box position="0 0.9 0.21" width="2.0" height="0.08" depth="0.02" material="color: #ff6b00; emissive: #ff6b00; emissiveIntensity: 1"></a-box>
    </a-entity>

    <a-entity position="-3.5 0 -11" rotation="0 -10 0">
      <a-box class="solid" position="0 0.75 0" width="3" height="1.5" depth="0.5" color="#273449"></a-box>
      <a-box position="0 1.2 0.26" width="2.6" height="0.08" depth="0.02" material="color: #00d2ff; emissive: #00d2ff; emissiveIntensity: 1"></a-box>
    </a-entity>

    <a-entity position="3.5 0 -11" rotation="0 10 0">
      <a-box class="solid" position="0 0.75 0" width="3" height="1.5" depth="0.5" color="#273449"></a-box>
      <a-box position="0 1.2 0.26" width="2.6" height="0.08" depth="0.02" material="color: #00d2ff; emissive: #00d2ff; emissiveIntensity: 1"></a-box>
    </a-entity>

    <!-- Pilar Struktural Arena -->
    <a-entity id="pillars">
      <a-entity position="-11 0 -11">
        <a-box class="solid" position="0 3 0" width="1.26" height="6" depth="1.26" color="#1e293b"></a-box>
        <a-box position="0 3 0" width="1.26" height="0.2" depth="1.26" material="color: #00d2ff; emissive: #00d2ff; emissiveIntensity: 1.2"></a-box>
      </a-entity>
      <a-entity position="11 0 -11">
        <a-box class="solid" position="0 3 0" width="1.26" height="6" depth="1.26" color="#1e293b"></a-box>
        <a-box position="0 3 0" width="1.26" height="0.2" depth="1.26" material="color: #00d2ff; emissive: #00d2ff; emissiveIntensity: 1.2"></a-box>
      </a-entity>
      <a-entity position="-11 0 11">
        <a-box class="solid" position="0 3 0" width="1.26" height="6" depth="1.26" color="#1e293b"></a-box>
        <a-box position="0 3 0" width="1.26" height="0.2" depth="1.26" material="color: #00d2ff; emissive: #00d2ff; emissiveIntensity: 1.2"></a-box>
      </a-entity>
      <a-entity position="11 0 11">
        <a-box class="solid" position="0 3 0" width="1.26" height="6" depth="1.26" color="#1e293b"></a-box>
        <a-box position="0 3 0" width="1.26" height="0.2" depth="1.26" material="color: #00d2ff; emissive: #00d2ff; emissiveIntensity: 1.2"></a-box>
      </a-entity>
    </a-entity>

    <!-- ========================================== -->
    <!-- 6. KAMERA, VR CONTROLLER & SENJATA PEGANGAN-->
    <!-- ========================================== -->
    <a-entity id="rig" position="0 0 4">
      <!-- Memakai <a-entity camera> (bukan <a-camera>) supaya wasd-controls bawaan
           tidak ikut terpasang; gerakan ditangani komponen player-movement. -->
      <a-entity
        id="player-camera"
        camera="fov: 80"
        position="0 1.6 0"
        look-controls
        player-movement
        player-collider="radius: 0.45; arenaLimit: 19.25"
      >
        <!-- Crosshair untuk mode Desktop -->
        <a-entity
          id="crosshair"
          cursor="fuse: false; rayOrigin: entity"
          raycaster="objects: .shootable, .interactable; far: 50"
          position="0 0 -1"
          geometry="primitive: ring; radiusInner: 0.012; radiusOuter: 0.02"
          material="color: #00d2ff; shader: flat; opacity: 0.9"
        >
          <a-circle radius="0.003" material="color: #ffffff; shader: flat"></a-circle>
        </a-entity>

        <!-- Wadah senjata yang sedang dipegang. Model tiap senjata dibuat otomatis oleh script. -->
        <a-entity id="equipped-rig" visible="false" position="0.20 -0.19 -0.42" rotation="0 0 0">
          <!-- Efek Kilatan Tembakan di Ujung Laras (posisi diatur per senjata) -->
          <a-sphere
            id="muzzle-flash"
            visible="false"
            position="0 0.045 -0.23"
            radius="0.036"
            material="color: #00ffff; emissive: #00d2ff; emissiveIntensity: 3.5; shader: flat; opacity: 0.9"
          ></a-sphere>
        </a-entity>
      </a-entity>

      <!-- VR Controller Tangan Kanan (Meta Quest & sejenisnya) -->
      <a-entity
        id="right-controller"
        laser-controls="hand: right"
        raycaster="objects: .shootable, .interactable; far: 50; lineColor: #00d2ff; lineOpacity: 0.8"
      ></a-entity>
    </a-entity>
  </a-scene>

  <!-- ========================================== -->
  <!-- SCRIPT TEKSTUR, TERMINAL, GERAKAN & SENJATA -->
  <!-- ========================================== -->
  <script>
    // ==========================================================
    // 0. KONFIGURASI SENJATA
    //    - rack : posisi/rotasi/ukuran di pegboard (koordinat lokal #weapon-rack),
    //             plate = ukuran pelat dudukan, label.y = tinggi teks nama
    //    - held : pose saat dipegang (desktop & VR). Laras selalu menghadap -Z.
    //    - fire : cooldown (detik), auto (tahan klik), recoil, profil suara
    //    Orientasi model GLB: rifle.glb laras ke +Z, assault_rfile.glb laras ke +X,
    //    rodin_sci_fi_gun.glb sudah punya rotasi sendiri -> disesuaikan lewat rotasi di bawah.
    // ==========================================================
    const WEAPONS = {
      rifle: {
        id: 'rifle',
        name: 'RIFLE',
        asset: '#rifle-model',
        rack: {
          pos: [0, 1.78, 0.2], rot: '0 90 0', length: 1.7,
          hitbox: [1.75, 0.46, 0.22],
          plate: [1.82, 0.44],
          label: { y: 1.5 }
        },
        held: {
          length: 0.85, rot: '0 180 0',
          desktopPos: [0.17, -0.21, -0.64], vrPos: [0, -0.03, -0.3]
        },
        muzzle: { pos: [0, 0.025, -0.47], radius: 0.04 },
        fire: {
          cooldown: 0.75, auto: false, recoilKick: 0.08, recoilPitch: 7,
          sound: { type: 'sawtooth', f0: 380, f1: 45, dur: 0.24, vol: 0.3 }
        }
      },
      assault: {
        id: 'assault',
        name: 'ASSAULT RIFLE',
        asset: '#assault-model',
        rack: {
          pos: [-0.38, 1.12, 0.16], rot: '0 0 0', length: 1.15,
          hitbox: [1.2, 0.6, 0.16],
          plate: [1.26, 0.6],
          label: { y: 0.78 }
        },
        held: {
          length: 0.62, rot: '0 90 0',
          desktopPos: [0.19, -0.21, -0.58], vrPos: [0, -0.03, -0.22]
        },
        muzzle: { pos: [0, 0.055, -0.34], radius: 0.03 },
        fire: {
          cooldown: 0.1, auto: true, recoilKick: 0.02, recoilPitch: 2.2,
          sound: { type: 'square', f0: 640, f1: 110, dur: 0.07, vol: 0.15 }
        }
      },
      rodin: {
        id: 'rodin',
        name: 'RODIN SCI-FI GUN',
        asset: '#rodin-model',
        rack: {
          pos: [0.62, 1.12, 0.12], rot: '0 -25 35', length: 0.56,
          hitbox: [0.65, 0.52, 0.22],
          plate: [0.7, 0.6],
          label: { y: 0.78 }
        },
        held: {
          length: 0.45, rot: '0 65 0',
          desktopPos: [0.2, -0.19, -0.42], vrPos: [0, -0.02, -0.2]
        },
        muzzle: { pos: [0, 0.045, -0.23], radius: 0.036 },
        fire: {
          cooldown: 0.14, auto: false, recoilKick: 0.045, recoilPitch: 5,
          sound: { type: 'sawtooth', f0: 520, f1: 75, dur: 0.13, vol: 0.24 }
        }
      }
    };

    const rad = (deg) => deg * Math.PI / 180;

    // ==========================================================
    // 1. TEKSTUR PROSEDURAL
    // ==========================================================
    // 1A. Gambar Tekstur Grid Lantai
    const gridCanvas = document.getElementById('grid-texture');
    const gridCtx = gridCanvas.getContext('2d');
    gridCtx.fillStyle = '#0f172a';
    gridCtx.fillRect(0, 0, 512, 512);
    gridCtx.strokeStyle = '#1e293b';
    gridCtx.lineWidth = 2;
    for (let i = 0; i <= 512; i += 64) {
      gridCtx.beginPath(); gridCtx.moveTo(i, 0); gridCtx.lineTo(i, 512); gridCtx.stroke();
      gridCtx.beginPath(); gridCtx.moveTo(0, i); gridCtx.lineTo(512, i); gridCtx.stroke();
    }
    gridCtx.strokeStyle = '#0284c7';
    gridCtx.lineWidth = 4;
    gridCtx.strokeRect(0, 0, 512, 512);

    // 1B. Gambar Tekstur Lubang Pegboard Senjata
    const pegCanvas = document.getElementById('pegboard-texture');
    const pegCtx = pegCanvas.getContext('2d');
    pegCtx.fillStyle = '#162032';
    pegCtx.fillRect(0, 0, 512, 512);
    pegCtx.strokeStyle = '#1e293b';
    pegCtx.lineWidth = 4;
    pegCtx.strokeRect(2, 2, 508, 508);
    for (let y = 32; y < 512; y += 64) {
      for (let x = 32; x < 512; x += 64) {
        pegCtx.beginPath();
        pegCtx.arc(x, y, 9, 0, Math.PI * 2);
        pegCtx.fillStyle = '#273449';
        pegCtx.fill();
        pegCtx.beginPath();
        pegCtx.arc(x, y, 6, 0, Math.PI * 2);
        pegCtx.fillStyle = '#070b14';
        pegCtx.fill();
      }
    }

    // 1C. Layar Terminal Informasi 3D
    const termCanvas = document.getElementById('terminal-canvas');
    const termCtx = termCanvas.getContext('2d');

    function drawPanel(x, y, w, h, border) {
      termCtx.fillStyle = '#0d1b30';
      termCtx.fillRect(x, y, w, h);
      termCtx.strokeStyle = border;
      termCtx.lineWidth = 2;
      termCtx.strokeRect(x, y, w, h);
    }

    function renderTerminalUI(state) {
      const { weaponName, shots, hits, patrol } = state;
      const holding = !!weaponName;
      const accuracy = shots > 0 ? Math.round((hits / shots) * 100) : 0;

      // Latar & grid
      termCtx.fillStyle = '#071120';
      termCtx.fillRect(0, 0, 1024, 512);
      termCtx.strokeStyle = 'rgba(0, 210, 255, 0.08)';
      termCtx.lineWidth = 1;
      for (let x = 0; x <= 1024; x += 32) {
        termCtx.beginPath(); termCtx.moveTo(x, 0); termCtx.lineTo(x, 512); termCtx.stroke();
      }
      for (let y = 0; y <= 512; y += 32) {
        termCtx.beginPath(); termCtx.moveTo(0, y); termCtx.lineTo(1024, y); termCtx.stroke();
      }

      // Header
      termCtx.fillStyle = '#0c223f';
      termCtx.fillRect(24, 24, 976, 68);
      termCtx.strokeStyle = '#00d2ff';
      termCtx.lineWidth = 2;
      termCtx.strokeRect(24, 24, 976, 68);
      termCtx.fillStyle = '#00d2ff';
      termCtx.font = 'bold 30px monospace';
      termCtx.fillText('TRAINING BATTLEGROUND // TERMINAL TELEMETRI', 48, 68);

      // Panel status senjata (kiri) & dummy (kanan)
      drawPanel(24, 108, 480, 92, holding ? '#00ff88' : '#ff6b00');
      termCtx.fillStyle = '#94a3b8';
      termCtx.font = '18px monospace';
      termCtx.fillText('STATUS SENJATA', 44, 138);
      termCtx.fillStyle = holding ? '#00ff88' : '#ff6b00';
      termCtx.font = 'bold 26px monospace';
      termCtx.fillText(holding ? weaponName : 'BELUM DIAMBIL', 44, 178);

      drawPanel(520, 108, 480, 92, patrol ? '#00ff88' : '#475569');
      termCtx.fillStyle = '#94a3b8';
      termCtx.font = '18px monospace';
      termCtx.fillText('DUMMY TARGET', 540, 138);
      termCtx.fillStyle = patrol ? '#00ff88' : '#94a3b8';

    // ==========================================================
    // 2. EFEK SUARA PROSEDURAL (AudioContext dibuat saat pertama dipakai,
    //    supaya tidak diblokir kebijakan autoplay browser)
    // ==========================================================
    let audioCtx = null;
    function getAudio() {
      if (!audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        audioCtx = new AC();
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playTone({ type = 'sine', f0 = 440, f1 = 440, dur = 0.12, vol = 0.2, stepAt = null }) {
      const ctx = getAudio();
      if (!ctx) return;
      const t = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(f0, t);
      if (stepAt !== null) {
        osc.frequency.setValueAtTime(f1, t + stepAt);
      } else if (f1 !== f0) {
        osc.frequency.exponentialRampToValueAtTime(f1, t + dur);
      }
      gain.gain.setValueAtTime(vol, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(t);
      osc.stop(t + dur);
    }

    const playGunshotSound = (profile) => playTone(profile);
    const playEquipSound = () => playTone({ type: 'sine', f0: 440, f1: 660, dur: 0.12, vol: 0.15, stepAt: 0.06 });
    const playHitSound = () => playTone({ type: 'triangle', f0: 980, f1: 420, dur: 0.15, vol: 0.25 });

    function playSlideSound() {
      const ctx = getAudio();
      if (!ctx) return;
      const dur = 0.75;
      const t = ctx.currentTime;
      const buffer = ctx.createBuffer(1, Math.floor(ctx.sampleRate * dur), ctx.sampleRate);
      const data = buffer.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;

      const src = ctx.createBufferSource();
      src.buffer = buffer;
      const filter = ctx.createBiquadFilter();
      filter.type = 'bandpass';
      filter.Q.value = 0.9;
      filter.frequency.setValueAtTime(1400, t);
      filter.frequency.exponentialRampToValueAtTime(260, t + dur);
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.0001, t);
      gain.gain.exponentialRampToValueAtTime(0.18, t + 0.06);
      gain.gain.exponentialRampToValueAtTime(0.001, t + dur);

      src.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      src.start(t);
    }

    // ==========================================================
    // 3. KOMPONEN GERAKAN PEMAIN: jalan, lari, JONGKOK & SLIDE
    //    Kontrol: WASD/Panah = gerak | Shift = lari | C = jongkok (tahan)
    //             Shift + C saat berlari = slide
    //    Menggantikan wasd-controls bawaan.
    // ==========================================================
    AFRAME.registerComponent('player-movement', {
      schema: {
        walkSpeed:     { type: 'number', default: 3.0 },
        sprintSpeed:   { type: 'number', default: 5.5 },
        crouchSpeed:   { type: 'number', default: 1.6 },
        slideSpeed:    { type: 'number', default: 8.0 },   // kecepatan awal slide
        slideDuration: { type: 'number', default: 0.85 },  // detik
        slideCooldown: { type: 'number', default: 0.6 },   // jeda sebelum bisa slide lagi
        standHeight:   { type: 'number', default: 1.6 },
        crouchHeight:  { type: 'number', default: 1.0 },
        slideHeight:   { type: 'number', default: 0.65 },
        acceleration:  { type: 'number', default: 10 },
        fovKick:       { type: 'number', default: 8 }      // tambahan FOV saat slide/lari
      },

      init: function () {
        this.keys = { forward: false, back: false, left: false, right: false, sprint: false, crouch: false };
        this.velocity = new THREE.Vector3();
        this.slideDir = new THREE.Vector3();
        this.quat = new THREE.Quaternion();
        this.euler = new THREE.Euler(0, 0, 0, 'YXZ');

        // State publik (dibaca komponen lain): 'stand' | 'sprint' | 'crouch' | 'slide'
        this.state = 'stand';
        this.speed = 0;

        this.slideTime = 0;
        this.slideStartSpeed = 0;
        this.slideCooldownLeft = 0;
        this.height = this.data.standHeight;
        this.baseFov = null;

        const KEYMAP = {
          KeyW: 'forward', ArrowUp: 'forward',
          KeyS: 'back', ArrowDown: 'back',
          KeyA: 'left', ArrowLeft: 'left',
          KeyD: 'right', ArrowRight: 'right',
          ShiftLeft: 'sprint', ShiftRight: 'sprint',
          KeyC: 'crouch'
        };

        this.onKeyDown = (e) => {
          const action = KEYMAP[e.code];
          if (!action) return;
          if (e.code.startsWith('Arrow')) e.preventDefault();
          if (action === 'crouch' && !e.repeat) {
            this.keys.crouch = true;
            this.tryStartSlide();   // C saat berlari -> slide
            return;
          }
          this.keys[action] = true;
        };
        this.onKeyUp = (e) => {
          const action = KEYMAP[e.code];
          if (action) this.keys[action] = false;
        };
        this.onBlur = () => {
          Object.keys(this.keys).forEach((k) => { this.keys[k] = false; });
        };

        window.addEventListener('keydown', this.onKeyDown);
        window.addEventListener('keyup', this.onKeyUp);
        window.addEventListener('blur', this.onBlur);
      },

      remove: function () {
        window.removeEventListener('keydown', this.onKeyDown);
        window.removeEventListener('keyup', this.onKeyUp);
        window.removeEventListener('blur', this.onBlur);
      },

      tryStartSlide: function () {
        const d = this.data;
        if (this.el.sceneEl.is('vr-mode')) return false;
        if (this.state !== 'sprint' || this.slideCooldownLeft > 0) return false;
        if (this.speed < d.walkSpeed * 1.15) return false;

        this.slideDir.set(this.velocity.x, 0, this.velocity.z).normalize();
        this.slideStartSpeed = d.slideSpeed;
        this.slideTime = 0;
        this.state = 'slide';
        playSlideSound();
        this.el.sceneEl.emit('player-slide');
        return true;
      },

      tick: function (time, deltaMs) {
        const dt = Math.min(deltaMs, 100) / 1000;
        if (!dt) return;

        const d = this.data;
        const k = this.keys;
        const obj = this.el.object3D;
        const inVR = this.el.sceneEl.is('vr-mode');

        // Di mode VR, tinggi & posisi dikendalikan headset
        if (inVR) {
          this.state = 'stand';
          this.speed = 0;
          return;
        }

        // Arah hadap (yaw) kamera
        obj.getWorldQuaternion(this.quat);
        this.euler.setFromQuaternion(this.quat, 'YXZ');
        const sin = Math.sin(this.euler.y);
        const cos = Math.cos(this.euler.y);

        // Input -> arah dunia (forward = (-sin, -cos), right = (cos, -sin))
        let ix = (k.right ? 1 : 0) - (k.left ? 1 : 0);
        let iz = (k.forward ? 1 : 0) - (k.back ? 1 : 0);
        const len = Math.hypot(ix, iz);
        if (len > 0) { ix /= len; iz /= len; }
        const wx = ix * cos - iz * sin;
        const wz = -ix * sin - iz * cos;

        this.slideCooldownLeft = Math.max(0, this.slideCooldownLeft - dt);

        if (this.state === 'slide') {
          // Slide: arah terkunci, kecepatan turun mulus sampai kecepatan jongkok
          this.slideTime += dt;
          const t = Math.min(this.slideTime / d.slideDuration, 1);
          const speed = d.crouchSpeed + (this.slideStartSpeed - d.crouchSpeed) * Math.pow(1 - t, 1.6);
          this.velocity.set(this.slideDir.x * speed, 0, this.slideDir.z * speed);

          if (t >= 1) {
            this.slideCooldownLeft = d.slideCooldown;
            this.state = k.crouch ? 'crouch' : 'stand';
          }
        } else {
          // Tentukan state: jongkok > lari (hanya saat maju) > berdiri
          if (k.crouch) this.state = 'crouch';
          else if (k.sprint && iz > 0.3) this.state = 'sprint';
          else this.state = 'stand';

          const targetSpeed = this.state === 'crouch' ? d.crouchSpeed
            : this.state === 'sprint' ? d.sprintSpeed
            : d.walkSpeed;
          const a = 1 - Math.exp(-d.acceleration * dt);
          this.velocity.x += (wx * targetSpeed - this.velocity.x) * a;
          this.velocity.z += (wz * targetSpeed - this.velocity.z) * a;
        }

        obj.position.x += this.velocity.x * dt;
        obj.position.z += this.velocity.z * dt;
        this.speed = Math.hypot(this.velocity.x, this.velocity.z);

        // Tinggi kamera (halus)
        const targetHeight = this.state === 'slide' ? d.slideHeight
          : this.state === 'crouch' ? d.crouchHeight
          : d.standHeight;
        const heightRate = targetHeight < this.height ? 14 : 9;
        this.height += (targetHeight - this.height) * (1 - Math.exp(-heightRate * dt));
        obj.position.y = this.height;

        // FOV kick saat lari / slide
        const cam = this.el.getObject3D('camera');
        if (cam && cam.isPerspectiveCamera) {
          if (this.baseFov === null) this.baseFov = cam.fov;
          const kick = this.state === 'slide' ? d.fovKick
            : this.state === 'sprint' ? d.fovKick * 0.5 * Math.min(this.speed / d.sprintSpeed, 1)
            : 0;
          const targetFov = this.baseFov + kick;
          if (Math.abs(cam.fov - targetFov) > 0.01) {
            cam.fov += (targetFov - cam.fov) * (1 - Math.exp(-8 * dt));
            cam.updateProjectionMatrix();
          }
        }
      }
    });

    // ==========================================================
    // 4. KOMPONEN COLLISION PEMAIN
    // ==========================================================
    AFRAME.registerComponent('player-collider', {
      schema: {
        radius: { type: 'number', default: 0.45 },
        arenaLimit: { type: 'number', default: 19.25 }
      },
      init: function () {
        this.obstacles = [];
        this.worldPos = new THREE.Vector3();
        this.obsPos = new THREE.Vector3();
        this.obsQuat = new THREE.Quaternion();
        this.obsEuler = new THREE.Euler(0, 0, 0, 'YXZ');

        this.el.sceneEl.addEventListener('loaded', () => {
          this.cacheObstacles();
        });
      },
      cacheObstacles: function () {
        const solidEls = this.el.sceneEl.querySelectorAll('.solid');
        this.obstacles = Array.from(solidEls).map((el) => {
          const customSize = el.getAttribute('data-collider-size');
          let halfW = 0.5;
          let halfD = 0.5;

          if (customSize) {
            const parts = customSize.split(' ').map(Number);
            halfW = (parts[0] || 1) / 2;
            halfD = (parts[1] || 1) / 2;
          } else {
            const w = parseFloat(el.getAttribute('width')) || 1;
            const d = parseFloat(el.getAttribute('depth')) || 1;
            halfW = w / 2;
            halfD = d / 2;
          }
          return { el, halfW, halfD };
        });
      },
      tock: function () {
        const camObj = this.el.object3D;
        camObj.getWorldPosition(this.worldPos);

        let px = this.worldPos.x;
        let pz = this.worldPos.z;
        const r = this.data.radius;
        const limit = this.data.arenaLimit;

        if (px < -limit) px = -limit;
        if (px > limit) px = limit;
        if (pz < -limit) pz = -limit;
        if (pz > limit) pz = limit;

        for (let i = 0; i < this.obstacles.length; i++) {
          const obs = this.obstacles[i];
          const obj3D = obs.el.object3D;
          if (!obj3D || !obj3D.visible) continue;

          obj3D.getWorldPosition(this.obsPos);
          obj3D.getWorldQuaternion(this.obsQuat);
          this.obsEuler.setFromQuaternion(this.obsQuat, 'YXZ');

          const yaw = this.obsEuler.y;
          const cos = Math.cos(-yaw);
          const sin = Math.sin(-yaw);

          const dx = px - this.obsPos.x;
          const dz = pz - this.obsPos.z;
          const localX = dx * cos - dz * sin;
          const localZ = dx * sin + dz * cos;

          const closestX = Math.max(-obs.halfW, Math.min(obs.halfW, localX));
          const closestZ = Math.max(-obs.halfD, Math.min(obs.halfD, localZ));

          const distX = localX - closestX;
          const distZ = localZ - closestZ;
          const distSq = distX * distX + distZ * distZ;

          if (distSq < r * r) {
            let pushLocalX = 0;
            let pushLocalZ = 0;

            if (distSq > 0.000001) {
              const dist = Math.sqrt(distSq);
              const overlap = r - dist;
              pushLocalX = (distX / dist) * overlap;
              pushLocalZ = (distZ / dist) * overlap;
            } else {
              const penX = obs.halfW - Math.abs(localX);
              const penZ = obs.halfD - Math.abs(localZ);
              if (penX < penZ) {
                pushLocalX = (localX >= 0 ? 1 : -1) * (penX + r);
              } else {
                pushLocalZ = (localZ >= 0 ? 1 : -1) * (penZ + r);
              }
            }

            const invCos = Math.cos(yaw);
            const invSin = Math.sin(yaw);
            px += pushLocalX * invCos - pushLocalZ * invSin;
            pz += pushLocalX * invSin + pushLocalZ * invCos;
          }
        }

        const deltaX = px - this.worldPos.x;
        const deltaZ = pz - this.worldPos.z;
        if (Math.abs(deltaX) > 0.0001 || Math.abs(deltaZ) > 0.0001) {
          camObj.position.x += deltaX;
          camObj.position.z += deltaZ;
        }
      }
    });

    // ==========================================================
    // 5. KOMPONEN AUTO-FIT MODEL .GLB
    //    Menskalakan model ke panjang tertentu & memusatkan pivot di tengah model.
    // ==========================================================
    AFRAME.registerComponent('weapon-auto-fit', {
      schema: {
        targetLength: { type: 'number', default: 0.45 }
      },
      init: function () {
        this.el.addEventListener('model-loaded', () => {
          const root = this.el.getObject3D('mesh');
          if (!root) return;

          root.position.set(0, 0, 0);
          root.scale.set(1, 1, 1);
          this.el.object3D.updateMatrixWorld(true);

          const parentInverse = new THREE.Matrix4().copy(this.el.object3D.matrixWorld).invert();
          const box = new THREE.Box3();
          const relMatrix = new THREE.Matrix4();
          const meshBox = new THREE.Box3();

          root.traverse((node) => {
            if (node.isMesh && node.geometry) {
              if (!node.geometry.boundingBox) {
                node.geometry.computeBoundingBox();
              }
              meshBox.copy(node.geometry.boundingBox);
              relMatrix.multiplyMatrices(parentInverse, node.matrixWorld);
              meshBox.applyMatrix4(relMatrix);
              box.union(meshBox);
            }
          });

          if (box.isEmpty()) return;

          const size = new THREE.Vector3();
          const center = new THREE.Vector3();
          box.getSize(size);
          box.getCenter(center);

          const maxDim = Math.max(size.x, size.y, size.z);
          if (maxDim > 0 && isFinite(maxDim)) {
            const scaleFactor = this.data.targetLength / maxDim;
            root.scale.setScalar(scaleFactor);
            root.position.set(
              -center.x * scaleFactor,
              -center.y * scaleFactor,
              -center.z * scaleFactor
            );
          }
        });
      }
    });

    // ==========================================================
    // 6. KOMPONEN MANAGER SENJATA, PEGBOARD & TERMINAL

    AFRAME.registerComponent('shooting-manager', {

      },

      // ---------- Pembuatan objek 3D dari konfigurasi WEAPONS ----------
      buildWeaponRack: function () {
        const rack = document.getElementById('weapon-rack');

        Object.values(WEAPONS).forEach((w) => {
          const [x, y, z] = w.rack.pos;

          // Grup senjata (disembunyikan saat senjata diambil)
          const group = document.createElement('a-entity');
          group.setAttribute('position', `${x} ${y} ${z}`);

          const model = document.createElement('a-entity');
          model.setAttribute('weapon-auto-fit', { targetLength: w.rack.length });
          model.setAttribute('gltf-model', w.asset);
          model.setAttribute('rotation', w.rack.rot);
          group.appendChild(model);

          // Hitbox transparan agar pegboard tetap bersih
          const hitbox = document.createElement('a-box');
          hitbox.classList.add('interactable');
          hitbox.setAttribute('data-weapon', w.id);
          hitbox.setAttribute('width', w.rack.hitbox[0]);
          hitbox.setAttribute('height', w.rack.hitbox[1]);
          hitbox.setAttribute('depth', w.rack.hitbox[2]);
          hitbox.setAttribute('material', 'opacity: 0; transparent: true');
          group.appendChild(hitbox);
          rack.appendChild(group);

          // Pelat dudukan di belakang senjata (+ garis aksen cyan di bawahnya)
          const [pw, ph] = w.rack.plate;
          const plate = document.createElement('a-box');
          plate.setAttribute('position', `${x} ${y} 0.045`);
          plate.setAttribute('width', pw);
          plate.setAttribute('height', ph);
          plate.setAttribute('depth', 0.016);
          plate.setAttribute('material', 'color: #0d1a2e; roughness: 0.7; metalness: 0.3');
          rack.appendChild(plate);

          const accent = document.createElement('a-box');
          accent.setAttribute('position', `${x} ${y - ph / 2} 0.056`);
          accent.setAttribute('width', pw);
          accent.setAttribute('height', 0.012);
          accent.setAttribute('depth', 0.01);
          accent.setAttribute('material', 'color: #00d2ff; emissive: #00d2ff; emissiveIntensity: 1.2');
          rack.appendChild(accent);

          // Label nama senjata
          const label = document.createElement('a-text');
          label.setAttribute('value', w.name);
          label.setAttribute('align', 'center');
          label.setAttribute('width', 1.1);
          label.setAttribute('color', '#7dd3fc');
          label.setAttribute('position', `${x} ${w.rack.label.y} 0.06`);
          rack.appendChild(label);

          this.slots[w.id] = { group, hitbox };

      buildHeldModels: function () {
        Object.values(WEAPONS).forEach((w) => {
          const hand = document.createElement('a-entity');
          hand.setAttribute('weapon-auto-fit', { targetLength: w.held.length });
          hand.setAttribute('gltf-model', w.asset);
          hand.setAttribute('rotation', w.held.rot);
          hand.setAttribute('visible', false);
          this.equippedRig.appendChild(hand);
          this.held[w.id] = hand;
        });
      },

      // ---------- Status & tampilan ----------
      syncTerminal: function () {
        renderTerminalUI({
          weaponName: this.heldId ? WEAPONS[this.heldId].name : null,
          shots: this.shots,
          hits: this.hits,
          patrol: this.patrol
        });
      },

      updateRackLabel: function () {
        const hint = this.heldId
          ? '[Klik senjata lain untuk Tukar | Klik pegboard / E untuk Taruh]'
          : '[Klik senjata / Tekan E untuk Ambil]';
        this.rackLabel.setAttribute('value', `PEGBOARD SENJATA\n${hint}`);
      },

      // ---------- Ambil / taruh / tukar senjata ----------
      restoreSlot: function (id) {
        const slot = this.slots[id];
        slot.group.setAttribute('visible', true);
        slot.hitbox.classList.add('interactable');
        this.held[id].setAttribute('visible', false);
      },

      equip: function (id) {
        if (this.heldId === id || !WEAPONS[id]) return;
        if (this.heldId) this.restoreSlot(this.heldId);   // tukar: kembalikan senjata lama

        const w = WEAPONS[id];
        this.heldId = id;
        this.triggerDown = false;
        this.nextFireAt = 0;
        this.recoil = 0;

        this.slots[id].group.setAttribute('visible', false);
        this.slots[id].hitbox.classList.remove('interactable');
        this.held[id].setAttribute('visible', true);

        this.muzzleFlash.setAttribute('position', w.muzzle.pos.join(' '));
        this.muzzleFlash.setAttribute('radius', w.muzzle.radius);
        this.equippedRig.setAttribute('visible', true);
        this.rackSurfaces.forEach((s) => s.classList.add('interactable'));

        playEquipSound();
        this.updateRackLabel();
        this.syncTerminal();
      },

      stow: function () {
        if (!this.heldId) return;
        this.restoreSlot(this.heldId);
        this.heldId = null;
        this.triggerDown = false;

        this.muzzleFlash.object3D.visible = false;
        this.equippedRig.setAttribute('visible', false);
        this.rackSurfaces.forEach((s) => s.classList.remove('interactable'));

        playEquipSound();
        this.updateRackLabel();
        this.syncTerminal();
      },

      // ---------- Interaksi & tembak ----------
      getRaycaster: function () {
        if (this.isVRMode && this.rightController.components.raycaster) {
          return this.rightController.components.raycaster;
        }
        return this.crosshair.components.raycaster;
      },

      getIntersected: function () {
        const rc = this.getRaycaster();
        return rc ? rc.intersectedEls : [];
      },

      // Interaksi dengan objek terdekat yang ditunjuk. Return true jika ditangani.
      interact: function (el) {
        if (!el) return false;

        const weaponId = el.getAttribute('data-weapon');
        if (weaponId) { this.equip(weaponId); return true; }

        if (el.getAttribute('data-action') === 'toggle-patrol') {
          this.togglePatrol();
          return true;
        }

        if (this.heldId && el.classList.contains('rack-surface')) {
          this.stow();
          return true;
        }
        return false;
      },

      togglePatrol: function () {
        const patrol = this.dummyEl && this.dummyEl.components['dummy-patrol'];
        if (!patrol) return;
        patrol.toggle();
        playEquipSound();
      },

      fire: function (time) {
        const w = WEAPONS[this.heldId];
        if (!w || time < this.nextFireAt) return false;
        this.nextFireAt = time + w.fire.cooldown * 1000;

        this.shots++;
        this.recoil = 1;
        this.flashTimer = 0.06;
        this.muzzleFlash.object3D.visible = true;
        playGunshotSound(w.fire.sound);

        const rc = this.getRaycaster();
        const intersected = rc ? rc.intersectedEls : [];
        if (this.dummyEl && intersected[0] === this.dummyEl) {
          const intersection = rc.getIntersection(this.dummyEl);
          this.dummyEl.emit('weapon-hit', { intersection });
        }
        this.syncTerminal();
        return true;
      },

      handlePrimaryAction: function () {
        const nearest = this.getIntersected()[0];
        if (this.interact(nearest)) return;
        if (!this.heldId) return;

        if (this.fire(performance.now())) {
          this.triggerDown = true;   // dipakai untuk senapan otomatis
        }
      },

      setupEvents: function () {
        const scene = this.el;

        scene.addEventListener('enter-vr', () => {
          this.isVRMode = true;
          this.crosshair.setAttribute('visible', 'false');
          // Pindah parent di level Object3D (tanpa memuat ulang model GLB)
          this.rightController.object3D.add(this.equippedRig.object3D);
        });

        scene.addEventListener('exit-vr', () => {
          this.isVRMode = false;
          this.crosshair.setAttribute('visible', 'true');
          this.camera.object3D.add(this.equippedRig.object3D);
        });

        // Umpan balik crosshair: hijau = bisa diinteraksi, merah = target
        this.crosshair.addEventListener('raycaster-intersection', (evt) => {
          const hitEl = evt.detail.els[0];
          const interactable = hitEl && hitEl.classList.contains('interactable');
          this.crosshair.setAttribute('material', 'color', interactable ? '#00ff88' : '#ff3b30');
          this.crosshair.setAttribute('scale', '1.25 1.25 1.25');
        });
        this.crosshair.addEventListener('raycaster-intersection-cleared', () => {
          this.crosshair.setAttribute('material', 'color', '#00d2ff');
          this.crosshair.setAttribute('scale', '1 1 1');
        });

        window.addEventListener('keydown', (e) => {
          if (e.repeat) return;
          if (e.code === 'KeyE') {
            this.interact(this.getIntersected()[0]);
          } else if (e.code === 'KeyT') {
            this.togglePatrol();
          }
        });

        // Hanya klik pada canvas (bukan tombol "Enter VR" dll) yang dianggap aksi
        window.addEventListener('mousedown', (e) => {
          if (e.button !== 0 || this.isVRMode) return;
          if (scene.canvas && e.target !== scene.canvas) return;
          this.handlePrimaryAction();
        });
        window.addEventListener('mouseup', (e) => {
          if (e.button === 0) this.triggerDown = false;
        });
        window.addEventListener('blur', () => { this.triggerDown = false; });

        this.rightController.addEventListener('triggerdown', () => this.handlePrimaryAction());
        this.rightController.addEventListener('triggerup', () => { this.triggerDown = false; });

        scene.addEventListener('target-hit', () => {
          this.hits++;
          this.syncTerminal();
        });

        scene.addEventListener('patrol-changed', (e) => {
          this.patrol = e.detail.enabled;
          const on = this.patrol;
          this.patrolButton.setAttribute('material', {
            color: on ? '#00ff88' : '#ff6b00',
            emissive: on ? '#00ff88' : '#ff6b00'
          });
          this.syncTerminal();
        });
      },

      // ---------- Per frame: senapan otomatis, recoil, kilatan, pose senjata ----------
      tick: function (time, deltaMs) {
        const dt = Math.min(deltaMs, 100) / 1000;
        if (!dt) return;

        if (this.flashTimer > 0) {
          this.flashTimer -= dt;
          if (this.flashTimer <= 0) this.muzzleFlash.object3D.visible = false;
        }

        if (!this.heldId) return;
        const w = WEAPONS[this.heldId];

        if (this.triggerDown && w.fire.auto) this.fire(time);

        this.recoil *= Math.exp(-dt * 16);
        if (this.recoil < 0.001) this.recoil = 0;

        // Pose target berdasarkan gerakan pemain (hanya mode desktop)
        const movement = this.camera.components['player-movement'];
        let ty = 0, trx = 0, tryaw = 0, trz = 0;
        if (!this.isVRMode && movement) {
          if (movement.state === 'slide') {
            ty = -0.05; trx = 3; tryaw = 8; trz = -18;
          } else if (movement.state === 'sprint') {
            const f = Math.min(movement.speed / movement.data.sprintSpeed, 1);
            ty = -0.035 * f; trx = -12 * f; tryaw = 14 * f; trz = 0;
          }
        }
        const p = this.pose;
        const a = 1 - Math.exp(-12 * dt);
        p.y += (ty - p.y) * a;
        p.rx += (trx - p.rx) * a;
        p.ry += (tryaw - p.ry) * a;
        p.rz += (trz - p.rz) * a;

        const base = this.isVRMode ? w.held.vrPos : w.held.desktopPos;
        const rig = this.equippedRig.object3D;
        rig.position.set(base[0], base[1] + p.y, base[2] + this.recoil * w.fire.recoilKick);
        rig.rotation.set(
          rad(p.rx + this.recoil * w.fire.recoilPitch),
          rad(p.ry),
          rad(p.rz)
        );
      }
    });

    // ==========================================================
    // 7. KOMPONEN PATROLI DUMMY (bolak-balik kanan-kiri di dalam zona)
    //    Batas diambil otomatis dari lebar lantai zona (.zone-floor) dikurangi
    //    lebar tubuh dummy (bounding box model) & margin, jadi tidak pernah keluar kotak.
    // ==========================================================
    AFRAME.registerComponent('dummy-patrol', {
      schema: {
        zone:    { type: 'selector', default: '#dummy-zone' },
        speed:   { type: 'number', default: 1.8 },    // m/detik
        margin:  { type: 'number', default: 0.15 },   // jarak aman dari tepi zona
        enabled: { type: 'boolean', default: false }
      },

      init: function () {
        this.dir = -1;                 // mulai bergerak ke kiri
        this.minX = -1;
        this.maxX = 1;
        this.ready = false;
        this.rail = null;

        this.el.addEventListener('model-loaded', () => this.computeBounds());
        if (this.data.zone) {
          this.data.zone.addEventListener('loaded', () => this.computeBounds());
        }
      },

      computeBounds: function () {
        const zone = this.data.zone;
        const mesh = this.el.getObject3D('mesh');
        if (!zone || !mesh) return;

        // Batas zona (dunia)
        const floor = zone.querySelector('.zone-floor') || zone;
        const zoneWidth = parseFloat(floor.getAttribute('width')) || 12;
        const zonePos = new THREE.Vector3();
        zone.object3D.getWorldPosition(zonePos);

        // Lebar tubuh dummy pada posisi sekarang (dunia)
        this.el.object3D.updateMatrixWorld(true);
        const box = new THREE.Box3().setFromObject(this.el.object3D);
        const pivotX = this.el.object3D.position.x;
        const halfLeft = pivotX - box.min.x;
        const halfRight = box.max.x - pivotX;

        const m = this.data.margin;
        this.minX = zonePos.x - zoneWidth / 2 + halfLeft + m;
        this.maxX = zonePos.x + zoneWidth / 2 - halfRight - m;
        if (this.minX > this.maxX) { this.minX = this.maxX = zonePos.x; }
        this.ready = true;

        this.buildRail();
        this.el.object3D.position.x = THREE.MathUtils.clamp(pivotX, this.minX, this.maxX);
      },

      // Garis panduan di lantai yang menunjukkan jalur patroli
      buildRail: function () {
        if (this.rail) this.rail.remove();
        const rail = document.createElement('a-box');
        const p = this.el.object3D.position;
        rail.setAttribute('width', Math.max(this.maxX - this.minX, 0.05));
        rail.setAttribute('height', 0.01);
        rail.setAttribute('depth', 0.05);
        rail.setAttribute('position', `${(this.minX + this.maxX) / 2} 0.055 ${p.z}`);
        rail.setAttribute('material', 'color: #00d2ff; emissive: #00d2ff; emissiveIntensity: 1; shader: flat; opacity: 0.4; transparent: true');
        rail.setAttribute('visible', this.data.enabled);
        this.el.sceneEl.appendChild(rail);
        this.rail = rail;
      },

      toggle: function () {
        this.setEnabled(!this.data.enabled);
      },

      setEnabled: function (on) {
        this.el.setAttribute('dummy-patrol', 'enabled', on);
      },

      update: function (oldData) {
        if (this.rail) this.rail.setAttribute('visible', this.data.enabled);
        if (oldData && oldData.enabled !== undefined && oldData.enabled !== this.data.enabled) {
          this.el.sceneEl.emit('patrol-changed', { enabled: this.data.enabled });
        }
      },

      tick: function (time, deltaMs) {
        if (!this.data.enabled || !this.ready) return;
        const dt = Math.min(deltaMs, 100) / 1000;
        const pos = this.el.object3D.position;

        // Melambat halus mendekati tepi, lalu berbalik arah
        const distToEnd = this.dir > 0 ? this.maxX - pos.x : pos.x - this.minX;
        const ease = THREE.MathUtils.clamp(distToEnd / 0.6, 0.3, 1);
        pos.x += this.dir * this.data.speed * ease * dt;

        if (pos.x >= this.maxX) { pos.x = this.maxX; this.dir = -1; }
        else if (pos.x <= this.minX) { pos.x = this.minX; this.dir = 1; }
      }
    });

    // ==========================================================
    // 8. KOMPONEN PERILAKU TARGET DUMMY SAAT TERTEMBAK
    // ==========================================================
    AFRAME.registerComponent('target-dummy', {
      init: function () {
        const el = this.el;
        const scene = el.sceneEl;
        this.tilt = 0;   // derajat, meluruh halus ke 0

        el.addEventListener('weapon-hit', (evt) => {
          playHitSound();
          scene.emit('target-hit');

          if (evt.detail && evt.detail.intersection) {
            const point = evt.detail.intersection.point;
            const spark = document.createElement('a-sphere');
            spark.setAttribute('position', `${point.x} ${point.y} ${point.z}`);
            spark.setAttribute('radius', '0.08');
            spark.setAttribute('material', 'color: #00ffff; emissive: #00d2ff; emissiveIntensity: 2.5; shader: flat');
            scene.appendChild(spark);

            setTimeout(() => {
              if (spark.parentNode) spark.parentNode.removeChild(spark);
            }, 150);
          }

          this.tilt = -18;
        });
      },
      tick: function (time, deltaMs) {
        if (this.tilt === 0) return;
        const dt = Math.min(deltaMs, 100) / 1000;
        this.tilt *= Math.exp(-dt * 14);
        if (Math.abs(this.tilt) < 0.05) this.tilt = 0;
        this.el.object3D.rotation.x = rad(this.tilt);
      }
    });
  </script>
</body>
</html>
